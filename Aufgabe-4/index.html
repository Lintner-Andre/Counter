<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preisrechner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="calculator-container">
        <h1>Preisrechner</h1>
        <div class="order-buttons-grid">
          <div class="order-button">
            <span class="order-button-item">Pizza</span
            ><span class="order-button-item-price">12.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Burger</span
            ><span class="order-button-item-price">10.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Salat</span
            ><span class="order-button-item-price">8.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Nudeln</span
            ><span class="order-button-item-price">9.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Suppe</span
            ><span class="order-button-item-price">6.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Dessert</span
            ><span class="order-button-item-price">7.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Getränk</span
            ><span class="order-button-item-price">3.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Nachtisch</span
            ><span class="order-button-item-price">5.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Snack</span
            ><span class="order-button-item-price">4.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Dessert</span
            ><span class="order-button-item-price">7.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Getränk</span
            ><span class="order-button-item-price">3.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Nachtisch</span
            ><span class="order-button-item-price">5.99 €</span>
          </div>
          <div class="order-button">
            <span class="order-button-item">Snack</span
            ><span class="order-button-item-price">4.99 €</span>
          </div>
        </div>
        <div class="total-container"><span>Gesamt</span><span>0,00€</span></div>
        <div class="checkout-container">
          <div class="button" id="reset">Zurücksetzen</div>
          <div class="checkout-location-container">
            <div class="button" id="inhouse">Vor Ort</div>
            <div class="button" id="delivery">Lieferung</div>
          </div>
        </div>
      </div>
      <div class="orders-container"></div>
    </div>
  </body>
</html>
